<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>음악 감상 퀴즈</title>
<meta name="description" content="듣고 작곡가와 작품명을 맞히는 클래식 감상 퀴즈">
<meta name="theme-color" content="#f3f5fa">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
<script type="module" src="js/app.js"></script>
</head>
<body>

<!-- 단색 SVG 아이콘 모음 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.6v12.8a1 1 0 0 0 1.52.85l10.2-6.4a1 1 0 0 0 0-1.7L9.52 4.75A1 1 0 0 0 8 5.6Z" fill="currentColor"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4.2" height="14" rx="1.6" fill="currentColor"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.6" fill="currentColor"/></symbol>
  <symbol id="i-restart" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4.5v4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="12" y="15.2" text-anchor="middle" font-size="7.5" font-weight="700" fill="currentColor" font-family="Pretendard Variable, sans-serif">10</text></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="4.8" cy="6.5" r="1.3" fill="currentColor"/><circle cx="4.8" cy="12" r="1.3" fill="currentColor"/><circle cx="4.8" cy="17.5" r="1.3" fill="currentColor"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3.2" fill="currentColor"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M4 7h3.5c2 0 3 1 4.5 5s2.5 5 4.5 5H20M4 17h3.5c1.2 0 2-.4 2.7-1.3M13.8 8.3C14.5 7.4 15.3 7 16.5 7H20M17.5 4.5 20 7l-2.5 2.5M17.5 14.5 20 17l-2.5 2.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.6A8 8 0 0 1 9.4 4.5a8 8 0 1 0 10.1 10.1Z" fill="currentColor"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
</svg>

<div class="page">
  <header class="topbar">
    <h1 class="brand">감상 퀴즈</h1>
    <div class="topbar-right">
      <span class="score" id="score" aria-live="polite"></span>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="다크 모드로 전환">
        <svg aria-hidden="true"><use href="#i-moon"/></svg>
      </button>
    </div>
  </header>

  <nav class="nav" aria-label="보기">
    <button class="pill" id="openList" type="button"><svg aria-hidden="true"><use href="#i-list"/></svg>전체 목록</button>
    <span class="pill-group"><button class="pill" id="openFocus" type="button"><svg aria-hidden="true"><use href="#i-target"/></svg><span id="focusLabel">집중 학습</span></button><button class="pill pill-x" id="clearFocus" type="button" aria-label="집중 학습 끄고 전체 곡으로" hidden><svg aria-hidden="true"><use href="#i-close"/></svg></button></span>
  </nav>

  <main class="card" id="quiz">
    <section id="quizActive">
      <div class="quiz-head">
        <span class="eyebrow" id="progress"></span>
        <button class="text-btn" id="reshuffle" type="button"><svg aria-hidden="true"><use href="#i-shuffle"/></svg>다시 섞기</button>
      </div>

      <div class="cover" id="cover" aria-hidden="true">
        <span class="cover-q">이 곡은?</span>
        <span class="cover-num" id="coverNum"></span>
      </div>

      <div class="player" id="quizPlayer">
        <div class="wave" id="quizWave" role="slider" tabindex="0" aria-label="재생 위치"></div>
        <div class="times"><span id="quizCur">0:00</span><span id="quizDur">--:--</span></div>
        <p class="player-msg" id="quizMsg" role="status"></p>
        <div class="controls">
          <button class="icon-btn lg" id="quizRestart" type="button" aria-label="시작 지점부터 다시 듣기"><svg aria-hidden="true"><use href="#i-restart"/></svg></button>
          <button class="play-btn" id="quizPlay" type="button" aria-label="재생"><svg aria-hidden="true"><use href="#i-play"/></svg></button>
          <button class="icon-btn lg" id="quizFwd" type="button" aria-label="10초 앞으로"><svg aria-hidden="true"><use href="#i-fwd"/></svg></button>
        </div>

        <!-- 임시 도구: 곡별 소리 보정. 가운데가 기본, 오른쪽이 크게, 왼쪽이 작게 -->
        <div class="gain" id="gain">
          <div class="gain-head">
            <label for="gainRange">소리 보정</label>
            <output id="gainOut" for="gainRange">기본</output>
          </div>
          <div class="gain-field">
            <input id="gainRange" type="range" min="-4" max="4" step="1" value="0" aria-describedby="gainHint">
            <span class="gain-ticks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
          </div>
          <div class="gain-ends" aria-hidden="true"><span>작게</span><span>크게</span></div>
          <p class="gain-hint" id="gainHint" hidden>이 기기는 웹에서 소리 크기를 바꿀 수 없어 보정이 적용되지 않습니다</p>
        </div>
      </div>

      <form class="answer" id="answerForm" autocomplete="off">
        <div class="answer-bar">
          <label class="field field-meta">
            <span class="sr-only">작곡가·시대</span>
            <input id="inMeta" type="text" placeholder="작곡가" enterkeyhint="next" autocapitalize="off" spellcheck="false">
          </label>
          <span class="answer-divider" aria-hidden="true"></span>
          <label class="field field-title">
            <span class="sr-only">작품명</span>
            <input id="inTitle" type="text" placeholder="작품명" enterkeyhint="done" autocapitalize="off" spellcheck="false">
          </label>
          <button class="submit-btn" id="submitBtn" type="submit" aria-label="제출"><span class="submit-label" id="nextLabel" aria-hidden="true">다음 문제</span><svg aria-hidden="true"><use href="#i-arrow"/></svg></button>
        </div>
      </form>

      <div id="feedback" aria-live="polite"></div>
    </section>

    <section id="quizDone" class="done" hidden>
      <p class="eyebrow" id="doneTitle">학습 완료</p>
      <p class="done-score" id="doneScore"></p>
      <p class="done-sub" id="doneSub"></p>
      <button class="primary-btn" id="retryMissed" type="button" hidden>틀린 곡만 다시 풀기</button>
      <button class="primary-btn" id="restartAll" type="button">다시 섞어서 풀기</button>

      <!-- 임시 도구: 소리 보정 결과 -->
      <div class="cal-result" id="calResult">
        <p class="cal-title">소리 보정 결과</p>
        <p class="cal-summary" id="calSummary"></p>
        <div class="cal-actions">
          <button class="pill sm" id="calCopy" type="button">복사</button>
          <button class="pill sm" id="calDownload" type="button">파일로 저장</button>
        </div>
        <p class="cal-help">복사하거나 저장한 내용을 Claude 에게 전달하면 곡별 소리 크기로 고정합니다</p>
        <details class="cal-details">
          <summary>내용 미리 보기</summary>
          <pre class="cal-pre" id="calText" tabindex="0"></pre>
        </details>
      </div>
    </section>
  </main>
</div>

<dialog class="sheet" id="listSheet" aria-labelledby="listTitle">
  <div class="sheet-head" title="끌어 내려 닫기">
    <h2 id="listTitle">음악 감상 목록</h2>
    <button class="icon-btn" type="button" data-close aria-label="닫기"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
  </div>
  <div class="sheet-body" id="listBody"></div>
</dialog>

<dialog class="sheet" id="focusSheet" aria-labelledby="focusTitle">
  <div class="sheet-head" title="끌어 내려 닫기">
    <h2 id="focusTitle">집중 학습 곡 고르기</h2>
    <button class="icon-btn" type="button" data-close aria-label="닫기"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
  </div>
  <div class="focus-tools">
    <button class="pill sm" id="focusAll" type="button">전체 선택</button>
    <button class="pill sm" id="focusNone" type="button">전체 해제</button>
    <span class="focus-count" id="focusCount" aria-live="polite"></span>
  </div>
  <div class="sheet-body" id="focusBody"></div>
  <div class="sheet-foot">
    <button class="primary-btn" id="focusStart" type="button">선택한 곡으로 시작</button>
  </div>
</dialog>

<!-- 숨긴 유튜브 플레이어: 화면 밖에 두어 영상·썸네일·제목이 절대 보이지 않게 한다 -->
<div class="yt-host" aria-hidden="true"><div id="yt"></div></div>
</body>
</html>
